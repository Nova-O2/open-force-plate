; Open Force Plate firmware — ESP32-S3-DevKitC-1 N16R8 + ADS1256
; Pin map: docs/DEVELOPMENT_PLAN.md §1.3

[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; N16R8: 16 MB quad flash + 8 MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Serial over the native USB port (the one marked "USB" on the DevKitC-1)
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
